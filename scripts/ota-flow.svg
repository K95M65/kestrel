<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="330" fill="#f7f7f8"/>
  <text x="490" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#111111">OTA release flow — upload is not rollout</text>

  <!-- Dev machine -->
  <rect x="24" y="64" width="280" height="150" rx="14" fill="#84cc16" fill-opacity="0.14" stroke="#84cc16" stroke-width="1.5"/>
  <text x="164" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#3f6212">Dev machine</text>
  <rect x="40" y="104" width="248" height="30" rx="8" fill="#84cc16"/>
  <text x="164" y="124" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">make upload-&lt;component&gt;</text>
  <text x="164" y="156" text-anchor="middle" font-size="11" fill="#3f6212">bump VERSION_* → build (version via ldflags)</text>
  <text x="164" y="174" text-anchor="middle" font-size="11" fill="#3f6212">→ zip artifact → gsutil upload</text>
  <text x="164" y="192" text-anchor="middle" font-size="11" fill="#3f6212">→ patch metadata.json (component key)</text>

  <!-- GCS -->
  <rect x="360" y="64" width="280" height="150" rx="14" fill="#eab308" fill-opacity="0.14" stroke="#eab308" stroke-width="1.5"/>
  <text x="500" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#854d0e">GCS bucket</text>
  <rect x="376" y="104" width="248" height="30" rx="8" fill="#eab308"/>
  <text x="500" y="124" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">ota/&lt;component&gt;/&lt;version&gt;.zip</text>
  <rect x="376" y="142" width="248" height="30" rx="8" fill="#eab308"/>
  <text x="500" y="162" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">metadata.json — version · min_version</text>
  <text x="500" y="196" text-anchor="middle" font-size="11" fill="#854d0e">served no-cache · one file for the whole fleet</text>

  <!-- Device -->
  <rect x="696" y="64" width="260" height="150" rx="14" fill="#0ea5e9" fill-opacity="0.14" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="826" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#0369a1">Device</text>
  <rect x="712" y="104" width="228" height="30" rx="8" fill="#0ea5e9"/>
  <text x="826" y="124" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">bootstrap worker</text>
  <text x="826" y="156" text-anchor="middle" font-size="11" fill="#0369a1">polls metadata.json (boot + every 5m)</text>
  <text x="826" y="174" text-anchor="middle" font-size="11" fill="#0369a1">current &lt; floor (min_version, else version)?</text>
  <text x="826" y="192" text-anchor="middle" font-size="11" fill="#0369a1">→ download · apply · restart service</text>

  <line x1="304" y1="139" x2="356" y2="139" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="640" y1="139" x2="692" y2="139" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="666" y="128" text-anchor="middle" font-size="10.5" fill="#475569">poll</text>

  <!-- Promote note -->
  <rect x="200" y="248" width="580" height="54" rx="12" fill="#dc2626" fill-opacity="0.10" stroke="#dc2626" stroke-width="1.2"/>
  <text x="490" y="270" text-anchor="middle" font-size="12.5" font-weight="700" fill="#991b1b">promote-ota.sh &lt;component&gt; — raises min_version: the explicit fleet-rollout decision</text>
  <text x="490" y="290" text-anchor="middle" font-size="11.5" fill="#991b1b">uploading preserves min_version — a promoted component stays put until the floor rises again</text>
</svg>
