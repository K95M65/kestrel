    <text x="162" y="596">display</text><text x="309" y="596">expression</text><text x="456" y="596">media</text><text x="603" y="596">connectivity</text><text x="750" y="596">companion</text><text x="897" y="596">system</text>
  </g>
  <!-- Brain-layer code that lives inside the HAL (known divergence) + the deterministic safety gate -->
  <rect x="94" y="640" width="424" height="40" rx="10" fill="#4f46e5"/>
  <text x="306" y="658" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">realtime voice agent — drivers/realtime</text>
  <text x="306" y="673" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.85">runtime-layer code hosted in the HAL</text>
  <rect x="534" y="640" width="432" height="40" rx="10" fill="#7f1d1d" fill-opacity="0.9"/>
  <text x="750" y="658" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">safety gate — hal/safety</text>
  <text x="750" y="673" text-anchor="middle" font-size="10" fill="#ffffff" fill-opacity="0.85">SAFETY.md bounds, enforced deterministically — never by the LLM</text>

  <!-- Linux Kernel -->
  <rect x="74" y="710" width="912" height="168" rx="16" fill="#ea580c"/>
  <text x="94" y="740" text-anchor="start" font-size="19" font-weight="600" fill="#ffffff">Linux Kernel</text>
  <text x="966" y="740" text-anchor="end" font-size="11" fill="#ffffff" fill-opacity="0.85">vendor kernel — not shipped</text>
  <rect x="94" y="752" width="872" height="68" rx="12" fill="#ffffff" fill-opacity="0.12"/>
  <text x="530" y="770" text-anchor="middle" font-size="12.5" font-weight="500" fill="#ffffff">Drivers — hal/drivers · per-board wiring: hal/board</text>
  <g fill="#ffffff" fill-opacity="0.2">
    <rect x="114" y="780" width="100" height="30" rx="8"/><rect x="226" y="780" width="70" height="30" rx="8"/><rect x="308" y="780" width="95" height="30" rx="8"/><rect x="415" y="780" width="95" height="30" rx="8"/><rect x="522" y="780" width="170" height="30" rx="8"/><rect x="704" y="780" width="120" height="30" rx="8"/><rect x="836" y="780" width="105" height="30" rx="8"/>
  </g>
  <g fill="#ffffff" font-size="12" text-anchor="middle">
    <text x="164" y="800">motors</text><text x="261" y="800">rgb</text><text x="355" y="800">display</text><text x="462" y="800">camera</text><text x="607" y="800">voice — STT · TTS · VAD</text><text x="764" y="800">gpio · touch</text><text x="888" y="800">bluetooth</text>
  </g>
  <rect x="94" y="830" width="872" height="32" rx="10" fill="#ffffff" fill-opacity="0.12"/>
  <text x="530" y="851" text-anchor="middle" font-size="14" font-weight="500" fill="#ffffff">Power Management</text>

  <!-- The two directions of the runtime loop -->
  <line x1="44" y1="380" x2="44" y2="690" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="30" y="535" text-anchor="middle" font-size="11" fill="#475569" transform="rotate(-90 30 535)">act — capability calls (HAL :5001)</text>
  <line x1="1016" y1="690" x2="1016" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>
  <text x="1032" y="535" text-anchor="middle" font-size="11" fill="#475569" transform="rotate(90 1032 535)">sense — events → intent → agent turn</text>
