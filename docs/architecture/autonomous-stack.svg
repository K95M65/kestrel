  <text x="94" y="518" text-anchor="start" font-size="19" font-weight="600" fill="#ffffff">Hardware Abstraction Layer (HAL)</text>
  <text x="966" y="518" text-anchor="end" font-size="11" fill="#ffffff" fill-opacity="0.85">contract/ (ABI) · hal (host)</text>
  <g fill="#ffffff" fill-opacity="0.2">
    <rect x="94" y="532" width="136" height="34" rx="10"/><rect x="241" y="532" width="136" height="34" rx="10"/><rect x="388" y="532" width="136" height="34" rx="10"/><rect x="535" y="532" width="136" height="34" rx="10"/><rect x="682" y="532" width="136" height="34" rx="10"/><rect x="829" y="532" width="137" height="34" rx="10"/>
    <rect x="94" y="574" width="136" height="34" rx="10"/><rect x="241" y="574" width="136" height="34" rx="10"/><rect x="388" y="574" width="136" height="34" rx="10"/><rect x="535" y="574" width="136" height="34" rx="10"/><rect x="682" y="574" width="136" height="34" rx="10"/><rect x="829" y="574" width="137" height="34" rx="10"/>
  </g>
  <g fill="#ffffff" font-size="13" text-anchor="middle">
