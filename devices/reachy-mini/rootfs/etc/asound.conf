# Reachy Mini ALSA aliases — rootfs overlay, copied to /etc/asound.conf.
#
# Recon 2026-07-29 on the Wireless unit (Pollen OS, Debian 13 trixie):
#
#   arecord -l / aplay -l
#     card 0: Audio [Reachy Mini Audio], device 0: USB Audio  <- mic AND speaker
#     card 1: vc4hdmi0                                        <- HDMI, ignore
#     card 2: vc4hdmi1                                        <- HDMI, ignore
#
# Capture and playback are the SAME USB device (Pollen Robotics Reachy Mini
# Audio), so mic and speaker share one clock domain — unlike Lamp, where the two
# sit on separate USB buses and drift apart (see lamp audio topology notes).
#
# Cards are addressed by NAME, not index: the HDMI cards register at boot and an
# index-based alias would move if enumeration order ever changed. The card id is
# "Audio" (5 chars) so it survives ALSA's 15-character card-id truncation.
#
# Deliberately does NOT set pcm.!default — the Pollen daemon owns the same
# hardware and must keep whatever default it expects.

# Every pcm.<alias> gets a matching ctl.<alias>: HAL derives the amixer control
# device from HAL_AUDIO_OUTPUT_ALSA by stripping the plugin prefix
# (hal/routes/audio.py::_amixer_ctl_device), so `plug:device_speaker` becomes
# `amixer -D device_speaker`. Without the ctl entry that call fails with
# "Invalid CTL device_speaker" and volume silently stops working — the API
# answers "No audio mixer controls found" while `amixer` on its own is fine.

pcm.device_mic {
    type plug
    slave.pcm "hw:CARD=Audio,DEV=0"
}
ctl.device_mic { type hw card Audio }

pcm.device_speaker {
    type plug
    slave.pcm "hw:CARD=Audio,DEV=0"
}
ctl.device_speaker { type hw card Audio }
